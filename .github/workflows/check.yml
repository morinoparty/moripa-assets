name: check

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  docs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Vite+ (vp)、Node (docs/.node-version)、pnpm (docs/package.json の packageManager) をまとめて入れ、
      # lockfile を固定したまま install する
      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: docs
          node-version-file: .node-version # working-directory からの相対パス
          cache: true # pnpm store を lockfile ごとにキャッシュ
          run-install: |
            args: ["--frozen-lockfile"]

      # assets/ の命名規則の検証と素材の生成を含む。typecheck は生成したマニフェストを読むため先に実行する
      - name: Build
        working-directory: docs
        run: pnpm run build

      - name: Check
        working-directory: docs
        run: pnpm run check:ci

      - name: Typecheck
        working-directory: docs
        run: pnpm run typecheck
