name: deploy

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "assets/**"
      - "docs/**"
      - ".github/workflows/deploy.yml"

permissions:
  contents: read

# デプロイが重なった場合は、後から来たものだけを残す
concurrency:
  group: deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    name: Deploy to Cloudflare Workers
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: voidzero-dev/setup-vp@cab1ab9eaff52d4857875f4f2c016e36af8f2c76 # v1.22.0
        with:
          working-directory: docs
          node-version-file: .node-version
          cache: true
          run-install: |
            args: ["--frozen-lockfile"]

      - name: Build
        working-directory: docs
        run: pnpm run build

      # Cloudflare CLI (cf deploy ./out) で docs/out を assets-only Worker (https://assets.morinoparty.workers.dev/) としてデプロイする
      # CLOUDFLARE_API_TOKEN と CLOUDFLARE_ACCOUNT_ID は org シークレット
      - name: Deploy
        working-directory: docs
        run: pnpm run deploy
        env:
          CF_SEND_TELEMETRY: "false"
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
